name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[web,pdf,dev]"
      - name: Install Node dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check:frontend
      - name: Build frontend
        run: npm run build:frontend
      - name: Portal TypeScript checks
        run: npm run typecheck:portals
      - name: Portal tests
        run: npm run test:portals
      - name: Python lint
        run: python -m ruff check src tests scripts
      - name: Python type check
        run: python -m mypy src/ai_job_search
      - name: Python tests and coverage
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=80
      - name: Repository security guards
        run: python tools/security_guards.py
      - name: Check patch whitespace
        run: git diff --check
