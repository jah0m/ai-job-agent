[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.1.0"
description = "Local-first AI job-search agent for Japan's mid-career market"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jiehong Li" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
web = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.scripts]
job-search = "ai_job_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_job_search = [
  "frontend_dist/index.html",
  "frontend_dist/assets/*",
]
