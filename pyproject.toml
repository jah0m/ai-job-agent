[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-agent"
version = "0.2.0"
description = "Local-first AI job-search agent for Japan's mid-career market"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jahom" }]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
pdf = ["pypdf>=5"]
web = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
job-search = "ai_job_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_job_search = [
  "frontend_dist/index.html",
  "frontend_dist/assets/*",
  "schemas/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 150
src = ["src", "tests", "scripts", "tools"]
extend-exclude = [".job-search", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ai_job_search"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf"]
follow_imports = "skip"

[tool.coverage.run]
branch = true
source = ["src/ai_job_search"]

[tool.coverage.report]
fail_under = 80
show_missing = true
